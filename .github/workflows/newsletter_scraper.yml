name: Newsletter scraper email

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Specific flyer URL to scrape, skipping inbox discovery (for testing)"
        required: false
        type: string
  schedule:
    # Runs 13:00 UTC daily. The script only emails when a new issue's slug
    # differs from the last one it processed (tracked in .state/last_slug.txt),
    # so a frequent schedule is safe even if the newsletter itself is weekly.
    - cron: "0 13 * * *"

permissions:
  contents: write

jobs:
  scrape-and-email:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        env:
          NEWSLETTER_SENDER: ${{ vars.NEWSLETTER_SENDER }}
          EMAIL_TO: ${{ vars.EMAIL_TO }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TEST_URL: ${{ inputs.url }}
        run: |
          if [ -n "$TEST_URL" ]; then
            python newsletter_scraper.py --url "$TEST_URL"
          else
            python newsletter_scraper.py
          fi

      - name: Commit updated state
        run: |
          if ! git diff --quiet -- .state; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add .state
            git commit -m "Record last processed newsletter issue [skip ci]"
            git push
          fi
